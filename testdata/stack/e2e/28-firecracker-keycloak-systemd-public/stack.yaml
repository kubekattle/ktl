apiVersion: torque.dev/v1
kind: Stack
name: firecracker-keycloak-systemd-public
cli:
  inferDeps: false
nodes:
  - name: keycloak-public-hostname
    kind: host.command.run
    host:
      transport: ssh
      targetEnv: TORQUE_LAB_SSH
      timeout: 10m
      command: |
        set -euo pipefail
        PUBLIC_URL="${TORQUE_KEYCLOAK_PUBLIC_URL:-http://141.105.65.227:18080}"
        ADMIN_PASSWORD="${TORQUE_KEYCLOAK_ADMIN_PASSWORD:-torque-admin-password}"
        LAB_KEY="${LAB_KEY:-/opt/firecracker-sandbox-lab/lab_ssh_key}"
        SSH_OPTS=(-i "${LAB_KEY}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
        configure_node() {
          local ip="$1"
          ssh "${SSH_OPTS[@]}" "root@${ip}" "NODE_IP='${ip}' PUBLIC_URL='${PUBLIC_URL}' bash -se" <<'NODE'
        set -euo pipefail
        ensure_env() {
          local key="$1"
          local value="$2"
          if grep -q "^${key}=" /etc/keycloak/keycloak.env; then
            sed -i "s|^${key}=.*|${key}=${value}|" /etc/keycloak/keycloak.env
          else
            printf '%s=%s\n' "${key}" "${value}" >>/etc/keycloak/keycloak.env
          fi
        }
        ensure_env KC_HOSTNAME "${PUBLIC_URL}"
        ensure_env KC_HOSTNAME_STRICT false
        ensure_env KC_PROXY_HEADERS xforwarded
        ensure_env KC_HTTP_ENABLED true
        ensure_env KC_HTTP_HOST 0.0.0.0
        ensure_env KC_HTTP_PORT 8080
        cat >/etc/systemd/system/keycloak.service <<EOF
        [Unit]
        Description=Keycloak identity service
        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=simple
        User=keycloak
        Group=keycloak
        EnvironmentFile=/etc/keycloak/keycloak.env
        WorkingDirectory=/opt/keycloak
        ExecStart=/opt/keycloak/bin/kc.sh start --cache=ispn --cache-stack=jdbc-ping --cache-embedded-network-bind-address=${NODE_IP} --http-enabled=true --http-host=0.0.0.0 --http-port=8080 --hostname=${PUBLIC_URL} --hostname-strict=false --proxy-headers=xforwarded
        Restart=always
        RestartSec=10
        TimeoutStartSec=900
        LimitNOFILE=1048576

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl restart keycloak
        NODE
        }
        configure_node 172.31.235.13
        configure_node 172.31.235.14
        for ip in 172.31.235.13 172.31.235.14; do
          for attempt in $(seq 1 120); do
            if ssh "${SSH_OPTS[@]}" "root@${ip}" "curl -fsS http://127.0.0.1:8080/realms/torque/.well-known/openid-configuration >/dev/null"; then
              echo "keycloak-public-hostname-ready ${ip}"
              break
            fi
            sleep 5
          done
          ssh "${SSH_OPTS[@]}" "root@${ip}" "curl -fsS http://127.0.0.1:8080/realms/torque/.well-known/openid-configuration >/dev/null"
        done
        ssh "${SSH_OPTS[@]}" root@172.31.235.13 "ADMIN_PASSWORD='${ADMIN_PASSWORD}' bash -se" <<'REALM'
        set -euo pipefail
        /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:8080 --realm master --user admin --password "${ADMIN_PASSWORD}" --config /tmp/kcadm-public.config >/dev/null
        /opt/keycloak/bin/kcadm.sh update realms/master --config /tmp/kcadm-public.config -s sslRequired=none
        /opt/keycloak/bin/kcadm.sh update realms/torque --config /tmp/kcadm-public.config -s sslRequired=none
        echo "keycloak-public-http-realms-ready"
        REALM
      deleteCommand: "true"

  - name: keycloak-public-proxy
    kind: host.command.run
    needs: [keycloak-public-hostname]
    host:
      transport: ssh
      targetEnv: TORQUE_LAB_SSH
      timeout: 5m
      command: |
        set -euo pipefail
        PUBLIC_PORT="${TORQUE_KEYCLOAK_PUBLIC_PORT:-18080}"
        NGINX_BIN="$(command -v nginx || true)"
        if ! command -v nginx >/dev/null 2>&1; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends nginx
          NGINX_BIN="$(command -v nginx)"
        fi
        mkdir -p /var/lib/torque-keycloak-public-nginx /var/log/nginx
        cat >/etc/nginx/torque-keycloak-public.conf <<EOF
        worker_processes 1;
        pid /run/torque-keycloak-public-nginx.pid;

        events {
            worker_connections 1024;
        }

        http {
            access_log /var/log/nginx/torque-keycloak-public-access.log;
            error_log /var/log/nginx/torque-keycloak-public-error.log warn;

            upstream torque_keycloak_systemd {
                least_conn;
                server 172.31.235.13:8080 max_fails=3 fail_timeout=10s;
                server 172.31.235.14:8080 max_fails=3 fail_timeout=10s;
            }

            server {
                listen ${PUBLIC_PORT};
                server_name _;

                location / {
                    proxy_pass http://torque_keycloak_systemd;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$http_host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto http;
                    proxy_set_header X-Forwarded-Host \$http_host;
                    proxy_set_header X-Forwarded-Port ${PUBLIC_PORT};
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection \"upgrade\";
                    proxy_read_timeout 180s;
                    proxy_send_timeout 180s;
                }
            }
        }
        EOF
        cat >/etc/systemd/system/torque-keycloak-public-nginx.service <<EOF
        [Unit]
        Description=Torque Keycloak public reverse proxy
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=simple
        ExecStart=${NGINX_BIN} -c /etc/nginx/torque-keycloak-public.conf -g 'daemon off;'
        ExecReload=${NGINX_BIN} -c /etc/nginx/torque-keycloak-public.conf -s reload
        Restart=always
        RestartSec=3

        [Install]
        WantedBy=multi-user.target
        EOF
        "${NGINX_BIN}" -c /etc/nginx/torque-keycloak-public.conf -t
        systemctl daemon-reload
        systemctl enable --now torque-keycloak-public-nginx >/dev/null
        systemctl restart torque-keycloak-public-nginx
        for attempt in $(seq 1 60); do
          if curl -fsS "http://127.0.0.1:${PUBLIC_PORT}/realms/torque/.well-known/openid-configuration" >/dev/null; then
            echo "keycloak-public-proxy-ready port=${PUBLIC_PORT}"
            exit 0
          fi
          sleep 2
        done
        echo "public proxy did not become ready on port ${PUBLIC_PORT}" >&2
        exit 1
      deleteCommand: |
        set +e
        systemctl disable --now torque-keycloak-public-nginx >/dev/null 2>&1
        rm -f /etc/systemd/system/torque-keycloak-public-nginx.service /etc/nginx/torque-keycloak-public.conf /run/torque-keycloak-public-nginx.pid
        systemctl daemon-reload

  - name: keycloak-public-verify
    kind: host.command.run
    needs: [keycloak-public-proxy]
    host:
      transport: local
      timeout: 5m
      command: |
        set -euo pipefail
        PUBLIC_URL="${TORQUE_KEYCLOAK_PUBLIC_URL:-http://141.105.65.227:18080}"
        USER_PASSWORD="${TORQUE_KEYCLOAK_USER_PASSWORD:-torque-user-password}"
        discovery="$(mktemp)"
        token="$(mktemp)"
        trap 'rm -f "${discovery}" "${token}"' EXIT
        curl -fsS "${PUBLIC_URL}/realms/torque/.well-known/openid-configuration" >"${discovery}"
        python3 - "${discovery}" "${PUBLIC_URL}" <<'PY'
        import json
        import sys

        discovery_path, public_url = sys.argv[1:3]
        with open(discovery_path, encoding="utf-8") as f:
            doc = json.load(f)
        expected = public_url.rstrip("/") + "/realms/torque"
        if doc.get("issuer") != expected:
            raise SystemExit(f"issuer mismatch: got {doc.get('issuer')!r}, expected {expected!r}")
        print(f"keycloak-public-discovery-ok issuer={expected}")
        PY
        curl -fsS \
          -d grant_type=password \
          -d client_id=torque-app \
          -d username=torque-user \
          -d "password=${USER_PASSWORD}" \
          "${PUBLIC_URL}/realms/torque/protocol/openid-connect/token" >"${token}"
        python3 - "${token}" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as f:
            doc = json.load(f)
        token = doc.get("access_token", "")
        if len(token) < 20:
            raise SystemExit("token response did not contain an access_token")
        print("keycloak-public-token-ok")
        PY
      deleteCommand: "true"

  - name: postgres-cluster-verify
    kind: host.command.run
    needs: [keycloak-public-verify]
    host:
      transport: ssh
      targetEnv: TORQUE_LAB_SSH
      timeout: 5m
      command: |
        set -euo pipefail
        LAB_KEY="${LAB_KEY:-/opt/firecracker-sandbox-lab/lab_ssh_key}"
        DB_PASSWORD="${TORQUE_KEYCLOAK_DB_PASSWORD:-torque-keycloak-db-password}"
        SSH_OPTS=(-i "${LAB_KEY}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
        repl_count="$(ssh "${SSH_OPTS[@]}" root@172.31.235.10 "runuser -u postgres -- psql -At -c \"select count(*) from pg_stat_replication;\"" | tr -cd '0-9')"
        echo "postgres-streaming-replicas=${repl_count}"
        [[ "${repl_count}" == "2" ]]
        for ip in 172.31.235.11 172.31.235.12; do
          row="$(ssh "${SSH_OPTS[@]}" "root@${ip}" "PGPASSWORD='${DB_PASSWORD}' psql -h 127.0.0.1 -U keycloak -d keycloak -At -c \"select current_database(), pg_is_in_recovery(), count(*) from realm where name='torque';\"")"
          echo "${ip} ${row}"
          case "${row}" in
            keycloak\|t\|1) ;;
            *) echo "replica ${ip} does not contain replicated torque realm row" >&2; exit 1 ;;
          esac
        done
      deleteCommand: "true"
