                    - name: SPARK_MASTER_HOST
                      value: spark-master
                    - name: SPARK_MASTER_PORT
                      value: "7077"
                  ports:
                    - containerPort: 7077
                    - containerPort: 8080
                  resources:
                    requests:
                      cpu: 200m
                      memory: 384Mi
                    limits:
                      cpu: "1"
                      memory: 768Mi
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: spark-worker
          namespace: ml
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: spark-worker
          template:
            metadata:
              labels:
                app: spark-worker
            spec:
              nodeSelector:
                fraud.torque.dev/workload: processing
              containers:
                - name: spark-worker
                  image: apache/spark:4.1.2-scala2.13-java17-python3-ubuntu
                  command: ["/opt/spark/bin/spark-class"]
                  args: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master.ml.svc.cluster.local:7077", "--cores", "1", "--memory", "512m", "--webui-port", "8081"]
                  env:
                    - name: SPARK_DAEMON_MEMORY
                      value: 256m
                  resources:
                    requests:
                      cpu: 200m
                      memory: 384Mi
                    limits:
                      cpu: "1"
                      memory: 768Mi
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: flink-jobmanager
          namespace: stream
        spec:
          type: NodePort
          selector:
            app: flink
            component: jobmanager
          ports:
            - name: rpc
              port: 6123
              targetPort: 6123
            - name: blob
              port: 6124
              targetPort: 6124
            - name: ui
              port: 8081
              targetPort: 8081
              nodePort: 32081
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: flink-jobmanager
          namespace: stream
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: flink
              component: jobmanager
          template:
            metadata:
              labels:
                app: flink
                component: jobmanager
            spec:
              nodeSelector:
                fraud.torque.dev/workload: control
              containers:
                - name: jobmanager
                  image: flink:1.20.1-scala_2.12-java17
                  securityContext:
                    runAsUser: 0
                  command: ["/bin/bash", "-lc"]
                  args:
                    - wget -q -O /opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar && exec /docker-entrypoint.sh jobmanager
                  env:
                    - name: JOB_MANAGER_RPC_ADDRESS
                      value: flink-jobmanager
                    - name: FLINK_PROPERTIES
                      value: |
                        jobmanager.rpc.address: flink-jobmanager
                        jobmanager.memory.process.size: 1024m
                        taskmanager.memory.process.size: 1200m
                        taskmanager.memory.task.heap.size: 256m
                        taskmanager.memory.managed.size: 128m
                        taskmanager.numberOfTaskSlots: 1
                        parallelism.default: 1
                  ports:
                    - containerPort: 6123
                    - containerPort: 8081
                  resources:
                    requests:
                      cpu: 200m
                      memory: 512Mi
                    limits:
                      cpu: "1"
                      memory: 1200Mi
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: flink-taskmanager
          namespace: stream
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: flink
              component: taskmanager
          template:
            metadata:
              labels:
                app: flink
                component: taskmanager
            spec:
              nodeSelector:
                fraud.torque.dev/workload: processing
              containers:
                - name: taskmanager
                  image: flink:1.20.1-scala_2.12-java17
                  securityContext:
                    runAsUser: 0
                  command: ["/bin/bash", "-lc"]
                  args:
                    - wget -q -O /opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar && exec /docker-entrypoint.sh taskmanager
                  env:
                    - name: JOB_MANAGER_RPC_ADDRESS
                      value: flink-jobmanager
                    - name: FLINK_PROPERTIES
                      value: |
                        jobmanager.rpc.address: flink-jobmanager
                        jobmanager.memory.process.size: 1024m
                        taskmanager.memory.process.size: 1200m
                        taskmanager.memory.task.heap.size: 256m
                        taskmanager.memory.managed.size: 128m
                        taskmanager.numberOfTaskSlots: 1
                        parallelism.default: 1
                  resources:
                    requests:
                      cpu: 200m
                      memory: 900Mi
                    limits:
                      cpu: "1"
